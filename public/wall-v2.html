<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>互動簽名牆 - 投影</title>
<script src="/signwall/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@7/dist/pixi.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; font-family: -apple-system, "Helvetica Neue", sans-serif; }
#wall { width: 100%; height: 100%; }
#ui { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; z-index: 10; }
#counter { color: rgba(255,255,255,0.5); font-size: 16px; letter-spacing: 1px; text-shadow: 0 0 20px rgba(0,0,0,0.8); }
#hint { color: rgba(255,255,255,0.2); font-size: 13px; margin-top: 6px; letter-spacing: 2px; }
</style>
</head>
<body>
<div id="wall"></div>
<div id="ui">
  <div id="counter">已收到 0 筆簽名</div>
  <div id="hint">請拿起 iPad 簽名</div>
</div>
<script>
// === 設定 ===
const SERVER_URL = window.location.origin;
const MAX_SIG_W = 220;
const MAX_SIG_H = 160;
const SPOTLIGHT_HOLD_DURATION = 5; // 在正中央亮相停留 5 秒
const MOVE_TO_WALL_DURATION = 1.0; // 縮小飄到累積牆的動畫時間
const REFLOW_DURATION = 0.8; // 每次有新人加入，其他人重新排版挪位置的動畫時間
const WALL_HEIGHT_RATIO = 0.28; // 累積牆佔畫面下方的高度比例
const WALL_MARGIN = 24; // 累積牆左右邊界留白
const MIN_TILE_SIZE = 26; // 每個小簽名格子的最小尺寸，避免縮到看不見

const COLORS = [
  0xFF6B6B, 0xFFA94D, 0xFFD93D, 0x69DB7C,
  0x4DABF7, 0x9775FA, 0xDA77F2, 0x20C997,
  0xF783AC, 0x74C0FC, 0xFFE066, 0x95E1D3
];

// === PixiJS 初始化 ===
// 注意：這裡用的是 pixi.js@7，Application 建構子是同步的，
// 沒有 v8 的 async app.init()，畫布也是 app.view 而不是 app.canvas。
const app = new PIXI.Application({
  resizeTo: window,
  antialias: true,
  backgroundColor: 0x0a0a1a,
  resolution: Math.min(window.devicePixelRatio || 1, 2)
});
const bgContainer = new PIXI.Container();
const sigContainer = new PIXI.Container();

let W, H;

document.getElementById('wall').appendChild(app.view);

W = app.screen.width;
H = app.screen.height;

app.stage.addChild(bgContainer);
app.stage.addChild(sigContainer);

createBackground();
createBackgroundParticles();
window.addEventListener('resize', onResize);

function onResize() {
  W = app.screen.width;
  H = app.screen.height;
}

// === 背景 ===
function createBackground() {
  const g = new PIXI.Graphics();
  const cx = W / 2;
  const cy = H / 2;
  const r = Math.max(W, H) * 0.8;
  for (let i = 0; i < 20; i++) {
    const t = i / 20;
    const alpha = 0.03 * (1 - t);
    const radius = r * t;
    g.beginFill(0x1a1a3e, alpha);
    g.drawCircle(cx, cy, radius);
    g.endFill();
  }
  bgContainer.addChild(g);
}

function createBackgroundParticles() {
  const count = 60;
  for (let i = 0; i < count; i++) {
    const g = new PIXI.Graphics();
    const r = 0.5 + Math.random() * 1.5;
    const alpha = 0.1 + Math.random() * 0.25;
    g.beginFill(0xffffff, alpha);
    g.drawCircle(0, 0, r);
    g.endFill();
    g.x = Math.random() * W;
    g.y = Math.random() * H;
    g.vx = (Math.random() - 0.5) * 0.15;
    g.vy = (Math.random() - 0.5) * 0.15;
    bgContainer.addChild(g);
  }
  app.ticker.add(() => {
    for (const child of bgContainer.children) {
      if (child.vx == null) continue;
      child.x += child.vx;
      child.y += child.vy;
      if (child.x < -10) child.x = W + 10;
      if (child.x > W + 10) child.x = -10;
      if (child.y < -10) child.y = H + 10;
      if (child.y > H + 10) child.y = -10;
    }
  });
}

// === Socket.io 連線 ===
let socket;
let sigCount = 0;
const counterEl = document.getElementById('counter');
const hintEl = document.getElementById('hint');

function connectSocket() {
  socket = io(SERVER_URL, { path: '/signwall/socket.io', query: { type: 'wall' } });

  socket.on('connect', () => {
    hintEl.textContent = '已連線，等待簽名...';
  });

  socket.on('new-signature', (data) => {
    sigCount++;
    counterEl.textContent = `已收到 ${sigCount} 筆簽名`;
    hintEl.textContent = '';
    receiveSignature(data);
  });

  socket.on('disconnect', () => {
    hintEl.textContent = '連線中斷，等待重新連線...';
  });
}

// === 簽名處理：先進佇列，確保同一時間只有一組在中央亮相 ===
let signatureQueue = [];
let spotlightBusy = false;

function receiveSignature(data) {
  if (!data.strokes || data.strokes.length === 0) return;
  const validStrokes = data.strokes.filter(s => s.length >= 2);
  if (validStrokes.length === 0) return;

  signatureQueue.push(validStrokes);
  processQueue();
}

function processQueue() {
  if (spotlightBusy || signatureQueue.length === 0) return;
  spotlightBusy = true;
  const validStrokes = signatureQueue.shift();
  showInSpotlight(validStrokes);
}

// === 正中央亮相 → 縮小飄到累積牆 ===
function showInSpotlight(validStrokes) {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const stroke of validStrokes) {
    for (const p of stroke) {
      if (p.x < minX) minX = p.x;
      if (p.y < minY) minY = p.y;
      if (p.x > maxX) maxX = p.x;
      if (p.y > maxY) maxY = p.y;
    }
  }

  const origW = maxX - minX || 1;
  const origH = maxY - minY || 1;
  const scale = Math.min(MAX_SIG_W / origW, MAX_SIG_H / origH);
  const cx = (minX + maxX) / 2;
  const cy = (minY + maxY) / 2;
  const color = COLORS[Math.floor(Math.random() * COLORS.length)];

  const g = new PIXI.Graphics();
  g.lineStyle(4, color, 0.95);
  for (const stroke of validStrokes) {
    g.moveTo((stroke[0].x - cx) * scale, (stroke[0].y - cy) * scale);
    for (let i = 1; i < stroke.length; i++) {
      g.lineTo((stroke[i].x - cx) * scale, (stroke[i].y - cy) * scale);
    }
  }

  const container = new PIXI.Container();
  container.addChild(g);

  const sigW = origW * scale;
  const sigH = origH * scale;

  // 先在正中央亮相：放大一點、淡入
  container.x = W / 2;
  container.y = H / 2;
  container.alpha = 0;
  container.scale.set(1.4);

  sigContainer.addChild(container);

  const entry = { container, sigW, sigH };

  const tl = gsap.timeline({
    onComplete: () => {
      spotlightBusy = false;
      processQueue(); // 換下一組排隊的簽名上場
    }
  });

  tl.to(container, { alpha: 1, duration: 0.4, ease: 'back.out(1.7)' })
    .to(container.scale, { x: 1.15, y: 1.15, duration: 0.4, ease: 'back.out(1.7)' }, '<')
    .to(container, { duration: SPOTLIGHT_HOLD_DURATION }) // 在正中央停留 5 秒
    .call(() => {
      wallEntries.push(entry);
      layoutWall(); // 加入累積牆，觸發全牆重新排版（新這組也會用這個動畫飄過去）
    });
}

// === 下方累積牆 ===
let wallEntries = []; // 依加入順序排列，永久保留、只會越排越密

function getWallArea() {
  const wallHeight = Math.max(MIN_TILE_SIZE, Math.min(260, H * WALL_HEIGHT_RATIO));
  return {
    x: WALL_MARGIN,
    y: H - wallHeight - WALL_MARGIN,
    width: Math.max(1, W - WALL_MARGIN * 2),
    height: wallHeight
  };
}

// 重新計算所有已加入牆上的簽名該放在哪個格子、多大，並用動畫過渡過去
function layoutWall() {
  const n = wallEntries.length;
  if (n === 0) return;
  const area = getWallArea();

  let cols = Math.max(1, Math.round(Math.sqrt((n * area.width) / area.height)));
  let rows = Math.ceil(n / cols);
  let tileSize = Math.min(area.width / cols, area.height / rows);

  // 格子小到一定程度就不再縮，改成允許牆往上長高一點，而不是縮到完全看不見
  if (tileSize < MIN_TILE_SIZE) {
    tileSize = MIN_TILE_SIZE;
    cols = Math.max(1, Math.floor(area.width / tileSize));
    rows = Math.ceil(n / cols);
  }

  const gridWidth = cols * tileSize;
  const gridHeight = rows * tileSize;
  const startX = area.x + (area.width - gridWidth) / 2;
  const startY = area.y + area.height - gridHeight; // 由下往上排，最新一批貼齊底部

  wallEntries.forEach((entry, i) => {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const targetX = startX + col * tileSize + tileSize / 2;
    const targetY = startY + row * tileSize + tileSize / 2;
    const targetScale = (tileSize * 0.8) / Math.max(entry.sigW, entry.sigH);

    gsap.to(entry.container, {
      x: targetX,
      y: targetY,
      duration: entry._inWall ? REFLOW_DURATION : MOVE_TO_WALL_DURATION,
      ease: entry._inWall ? 'power2.inOut' : 'power3.out'
    });
    gsap.to(entry.container.scale, {
      x: targetScale,
      y: targetScale,
      duration: entry._inWall ? REFLOW_DURATION : MOVE_TO_WALL_DURATION,
      ease: entry._inWall ? 'power2.inOut' : 'power3.out'
    });
    entry._inWall = true;
  });
}

// 所有函式與變數都宣告完成後才連線，避免 let socket 尚未初始化就被存取
connectSocket();
</script>
</body>
</html>
