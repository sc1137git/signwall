<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>英文單字競賽｜學生端</title>
<script src="/signwall/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033;touch-action:none}button,input{font:inherit}.app{height:100%;display:flex;flex-direction:column}.top{height:82px;background:#fff;border-bottom:1px solid #dfe5ee;display:flex;align-items:center;gap:14px;padding:10px 16px}.badge{width:54px;height:54px;border-radius:18px;background:#172033;color:#fff;display:grid;place-items:center;font-weight:900;font-size:26px;flex:0 0 auto}.info{min-width:0;flex:1}.title{font-size:15px;color:#6b7280;font-weight:700}.question{font-size:25px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.round{font-size:13px;color:#6b7280}.canvasWrap{flex:1;margin:10px;background:#fff;border-radius:20px;box-shadow:0 5px 24px rgba(25,45,80,.08);overflow:hidden;position:relative}.canvasWrap canvas{width:100%;height:100%;display:block;touch-action:none}.hint{position:absolute;inset:0;display:grid;place-items:center;color:#c1c8d3;font-size:28px;font-weight:800;pointer-events:none}.toolbar{height:88px;background:#fff;border-top:1px solid #dfe5ee;padding:12px 16px;display:flex;gap:12px}.btn{border:0;border-radius:16px;padding:0 24px;font-weight:900;font-size:19px}.secondary{background:#e9edf3;color:#263247}.primary{flex:1;background:#2563eb;color:#fff}.primary:disabled{opacity:.35}.status{position:fixed;top:94px;left:50%;transform:translateX(-50%);padding:9px 16px;border-radius:999px;background:#172033;color:white;font-size:14px;opacity:0;transition:.2s;z-index:30;pointer-events:none}.status.show{opacity:1}.picker{position:fixed;inset:0;background:#f5f7fb;z-index:50;display:flex;flex-direction:column;padding:24px}.picker h1{text-align:center;margin:12px 0 4px;font-size:28px}.picker p{text-align:center;color:#6b7280;margin:0 0 22px}.numbers{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:720px;width:100%;margin:auto}.num{aspect-ratio:1;border:2px solid #d7dce5;background:#fff;border-radius:22px;font-size:34px;font-weight:900;color:#172033}.num.active{border-color:#2563eb;background:#eef4ff}.num.used{opacity:.45}.change{border:0;background:transparent;color:#2563eb;font-weight:800;padding:8px}.submitted{position:absolute;right:12px;top:12px;border-radius:999px;padding:7px 11px;background:#dcfce7;color:#166534;font-weight:800;font-size:13px;display:none}.submitted.show{display:block}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="badge" id="playerBadge">?</div>
    <div class="info"><div class="title">英文單字競賽</div><div class="question" id="question">等待老師出題…</div><div class="round" id="round">第 1 題</div></div>
    <button class="change" id="changeBtn">換號碼</button>
  </div>
  <div class="canvasWrap" id="canvasWrap"><canvas id="canvas"></canvas><div class="hint" id="hint">在這裡寫答案</div><div class="submitted" id="submitted">已送出 ✓</div></div>
  <div class="toolbar"><button class="btn secondary" id="clearBtn">清除</button><button class="btn primary" id="submitBtn" disabled>送出答案</button></div>
</div>
<div class="status" id="status"></div>
<div class="picker" id="picker"><h1>我是幾號？</h1><p>每台 iPad 選擇自己的比賽編號</p><div class="numbers" id="numbers"></div></div>
<script>
const socket=io(location.origin,{path:'/signwall/socket.io',query:{type:'student'}});
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),wrap=document.getElementById('canvasWrap');
let player=Number(localStorage.getItem('wordGamePlayer'))||0,strokes=[],current=[],drawing=false,W=800,H=500,round=1,submittedRound=0,state=null;
function toast(t,bg='#172033'){const el=document.getElementById('status');el.textContent=t;el.style.background=bg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1800)}
function buildPicker(active=[]){const box=document.getElementById('numbers');box.innerHTML='';for(let i=1;i<=12;i++){const b=document.createElement('button');b.className='num'+(i===player?' active':'')+(active.includes(i)&&i!==player?' used':'');b.textContent=i;b.onclick=()=>choose(i);box.appendChild(b)}}
function choose(n){player=n;localStorage.setItem('wordGamePlayer',n);document.getElementById('playerBadge').textContent=n;document.getElementById('picker').style.display='none';socket.emit('player-select',{player:n});}
document.getElementById('changeBtn').onclick=()=>{document.getElementById('picker').style.display='flex';buildPicker(state?.activePlayers||[])};
function applyState(s){state=s;round=s.round||1;document.getElementById('question').textContent=s.question||'等待老師出題…';document.getElementById('round').textContent=`第 ${round} 題`;buildPicker(s.activePlayers||[]);if(player){document.getElementById('playerBadge').textContent=player;document.getElementById('picker').style.display='none';socket.emit('player-select',{player});}if(submittedRound&&submittedRound!==round) clearAll();}
socket.on('connect',()=>{toast('已連線','#15803d');socket.emit('state-request')});socket.on('game-state',applyState);socket.on('round-changed',s=>{applyState(s);clearAll();toast('下一題開始！','#2563eb')});socket.on('question-changed',s=>applyState(s));socket.on('active-players',a=>{if(state)state.activePlayers=a;buildPicker(a)});socket.on('reset-all',s=>{applyState(s);clearAll();toast('比賽已重置')});socket.on('disconnect',()=>toast('連線中斷','#b45309'));
function resize(){const r=wrap.getBoundingClientRect(),dpr=devicePixelRatio||1;W=Math.max(100,Math.floor(r.width));H=Math.max(100,Math.floor(r.height));canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);ctx.strokeStyle='#111827';ctx.lineWidth=4;ctx.lineCap='round';ctx.lineJoin='round';redraw()}
function pos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function line(points){if(points.length<2)return;ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);for(let i=1;i<points.length;i++)ctx.lineTo(points[i].x,points[i].y);ctx.stroke()}
function redraw(){ctx.clearRect(0,0,W,H);strokes.forEach(line);if(current.length)line(current);document.getElementById('hint').style.display=strokes.length||current.length?'none':'grid';document.getElementById('submitBtn').disabled=!strokes.length&&!current.length}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();drawing=true;current=[pos(e)];canvas.setPointerCapture?.(e.pointerId);redraw()});canvas.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();current.push(pos(e));redraw()});function end(e){if(!drawing)return;e.preventDefault();drawing=false;if(current.length)strokes.push(current);current=[];redraw()}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
function clearAll(){strokes=[];current=[];submittedRound=0;document.getElementById('submitted').classList.remove('show');redraw()}
document.getElementById('clearBtn').onclick=clearAll;
document.getElementById('submitBtn').onclick=()=>{if(!player)return document.getElementById('picker').style.display='flex';if(current.length){strokes.push(current);current=[]}if(!strokes.length)return;socket.emit('submit-answer',{player,round,strokes,width:W,height:H});submittedRound=round;document.getElementById('submitted').classList.add('show');toast('答案已送到大螢幕','#15803d')};
window.addEventListener('resize',resize);resize();if(!player)document.getElementById('picker').style.display='flex';
</script>
</body></html>
