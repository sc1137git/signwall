<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手寫競賽｜投影</title><script src="/signwall/socket.io/socket.io.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f172a;color:white;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{height:100%;padding:18px;display:flex;flex-direction:column;gap:13px}.top{display:flex;align-items:end;gap:16px}.title{flex:1;min-width:0}.brand{font-size:20px;color:#93c5fd;font-weight:900}.question{font-size:42px;font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.round{font-size:20px;color:#cbd5e1;font-weight:850}.timer{min-width:130px;text-align:right;font-size:44px;font-weight:1000;color:#60a5fa}.grid{flex:1;display:grid;gap:12px;min-height:0}.card{border:2px dashed #64748b;border-radius:17px;background:#111c32;overflow:hidden;display:flex;flex-direction:column;min-height:0}.card.hidden{display:none}.card.answered{border-style:solid;border-color:#60a5fa;background:#fff}.drawing{flex:1;position:relative;min-height:0}.drawing canvas{width:100%;height:100%}.wait{position:absolute;inset:0;display:grid;place-items:center;color:#64748b;font-size:22px;font-weight:900}.answered .wait{display:none}.foot{height:42px;background:#0b1220;display:flex;align-items:center;justify-content:space-between;padding:0 12px}.num{font-size:22px;font-weight:950}.score{font-size:21px;font-weight:950;color:#facc15}.preview{position:fixed;inset:0;background:#0f172a;z-index:60;display:none;place-items:center;text-align:center;padding:40px}.preview.show{display:grid}.previewQ{font-size:clamp(70px,11vw,150px);font-weight:1000}.previewCount{font-size:70px;color:#facc15;font-weight:1000;margin-top:25px}.join{position:fixed;inset:0;background:#0f172a;z-index:100;display:grid;place-items:center}.joinCard{width:min(480px,90%);text-align:center}.join input{width:100%;font-size:40px;text-align:center;border-radius:16px;padding:14px;font-weight:1000}.join button{width:100%;margin-top:10px;padding:14px;border:0;border-radius:14px;background:#2563eb;color:#fff;font-size:22px;font-weight:950}</style></head><body><div class="app"><div class="top"><div class="title"><div class="brand" id="brand">手寫競賽</div><div class="question" id="question">請加入場次</div></div><div class="round" id="round"></div><div class="timer" id="timer">--</div></div><div class="grid" id="grid"></div></div><div class="preview" id="preview"><div><div class="brand" id="previewBrand"></div><div class="previewQ" id="previewQ"></div><div class="previewCount" id="previewCount"></div></div></div><div class="join" id="join"><div class="joinCard"><h1>投影加入競賽</h1><input id="code" inputmode="numeric" maxlength="4" placeholder="場次碼"><button id="joinBtn">加入</button><div id="msg"></div></div></div><script>const socket=io(location.origin,{path:'/signwall/socket.io',query:{type:'display'}}),grid=document.getElementById('grid');let state={eligiblePlayers:[]};for(let i=1;i<=12;i++){const e=document.createElement('div');e.className='card';e.id='p'+i;e.innerHTML=`<div class="drawing"><canvas id="c${i}"></canvas><div class="wait">等待 ${i} 號</div></div><div class="foot"><div class="num">${i} 號</div><div class="score" id="s${i}">0 分</div></div>`;grid.appendChild(e)}const initial=new URLSearchParams(location.search).get('session')||'';document.getElementById('code').value=initial;function join(){socket.emit('join-session',{sessionCode:document.getElementById('code').value.trim()})}document.getElementById('joinBtn').onclick=join;socket.on('connect',()=>{if(initial)join()});socket.on('session-result',r=>{if(r.ok){document.getElementById('join').style.display='none';history.replaceState(null,'',`?session=${r.sessionCode}`)}else document.getElementById('msg').textContent='找不到這個場次'});function prompt(){if(state.practiceMode||state.phase==='practice')return'連線測試／練習';if(state.question)return state.question;if(['preview','running','ended','history'].includes(state.phase)||state.viewingHistory)return'請聽老師念題';return'等待老師出題…'}function layout(){const v=state.eligiblePlayers||[];for(let i=1;i<=12;i++)document.getElementById('p'+i).classList.toggle('hidden',!v.includes(i));const n=Math.max(1,v.length);let c,r;if(n<=2){c=n;r=1}else if(n<=4){c=2;r=2}else if(n<=6){c=3;r=2}else if(n<=8){c=4;r=2}else{c=4;r=3}grid.style.gridTemplateColumns=`repeat(${c},1fr)`;grid.style.gridTemplateRows=`repeat(${r},1fr)`}function draw(i,r){const card=document.getElementById('p'+i);if(card.classList.contains('hidden'))return;const cv=document.getElementById('c'+i),b=cv.parentElement.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=b.width*d;cv.height=b.height*d;const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);c.clearRect(0,0,b.width,b.height);card.classList.toggle('answered',!!r);if(!r)return;const sc=Math.min(b.width/(r.width||1),b.height/(r.height||1))*.9,ox=(b.width-r.width*sc)/2,oy=(b.height-r.height*sc)/2;c.strokeStyle='#111827';c.lineWidth=Math.max(3,b.width/120);c.lineCap='round';c.lineJoin='round';for(const st of r.strokes||[]){if(st.length<2)continue;c.beginPath();c.moveTo(ox+st[0].x*sc,oy+st[0].y*sc);for(let k=1;k<st.length;k++)c.lineTo(ox+st[k].x*sc,oy+st[k].y*sc);c.stroke()}}function render(s){state={...state,...s};const name=state.competitionName||'手寫競賽';document.getElementById('brand').textContent=name;document.getElementById('previewBrand').textContent=name;document.getElementById('question').textContent=prompt();document.getElementById('round').textContent=state.viewingHistory?`第 ${state.round} 題・回看`:state.practiceMode?'練習模式':`第 ${state.round||1} 題`;layout();for(let i=1;i<=12;i++){document.getElementById('s'+i).textContent=state.practiceMode?'練習':`${state.scores?.[i]||0} 分`;draw(i,state.responses?.[i])}timer()}function timer(){const e=document.getElementById('timer'),pv=document.getElementById('preview');pv.classList.toggle('show',state.phase==='preview'&&!state.viewingHistory);if(state.viewingHistory)e.textContent='回看';else if(state.phase==='preview'){const l=Math.max(0,Math.ceil((state.previewEndAt-Date.now())/1000));document.getElementById('previewQ').textContent=prompt();document.getElementById('previewCount').textContent=l||'開始！';e.textContent=`看題 ${l}`}else if(state.phase==='running')e.textContent=`${Math.max(0,Math.ceil((state.timerEndAt-Date.now())/1000))}s`;else if(state.phase==='ended')e.textContent='時間到';else if(state.practiceMode)e.textContent='連線練習';else e.textContent='待開始'}setInterval(timer,150);socket.on('display-state',render);socket.on('answer-updated',({player,response})=>{if(response)state.responses[player]=response;else delete state.responses[player];draw(player,response)});socket.on('score-updated',({player,score})=>{state.scores[player]=score;document.getElementById('s'+player).textContent=`${score} 分`});window.onresize=()=>render(state);</script></body></html>
