<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英文單字競賽｜大螢幕</title><script src="/signwall/socket.io/socket.io.js"></script><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f172a;color:white;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{height:100%;padding:18px;display:flex;flex-direction:column;gap:14px}.top{display:flex;align-items:end;gap:18px}.brand{font-size:20px;font-weight:800;color:#93c5fd}.question{font-size:42px;line-height:1.05;font-weight:950;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.round{font-size:20px;color:#cbd5e1;font-weight:800}.grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:12px;min-height:0}.card{position:relative;border:2px dashed #64748b;border-radius:18px;background:#111c32;overflow:hidden;display:flex;flex-direction:column;min-height:0}.card.answered{border-style:solid;border-color:#60a5fa;background:#fff}.drawing{flex:1;min-height:0;position:relative}.drawing canvas{width:100%;height:100%;display:block}.foot{height:42px;background:#0b1220;display:flex;align-items:center;justify-content:space-between;padding:0 12px}.num{font-size:22px;font-weight:950}.score{font-size:21px;font-weight:900;color:#facc15}.wait{position:absolute;inset:0;display:grid;place-items:center;color:#64748b;font-size:22px;font-weight:900}.answered .wait{display:none}.status{position:fixed;right:18px;top:18px;width:12px;height:12px;border-radius:50%;background:#f59e0b;box-shadow:0 0 0 5px rgba(245,158,11,.14)}.status.on{background:#22c55e;box-shadow:0 0 0 5px rgba(34,197,94,.14)}
</style></head><body><div class="app"><div class="top"><div><div class="brand">SPELLING CHALLENGE</div><div class="question" id="question">等待老師出題…</div></div><div class="round" id="round">第 1 題</div></div><div class="grid" id="grid"></div></div><div class="status" id="status"></div><script>
const socket=io(location.origin,{path:'/signwall/socket.io',query:{type:'display'}});let state={round:1,question:'',scores:{},responses:{}};const grid=document.getElementById('grid');
for(let i=1;i<=12;i++){const c=document.createElement('div');c.className='card';c.id='card'+i;c.innerHTML=`<div class="drawing"><canvas id="c${i}"></canvas><div class="wait">等待 ${i} 號</div></div><div class="foot"><div class="num">${i} 號</div><div class="score" id="s${i}">0 分</div></div>`;grid.appendChild(c)}
function drawResponse(i,r){const card=document.getElementById('card'+i),cv=document.getElementById('c'+i),box=cv.parentElement.getBoundingClientRect(),dpr=devicePixelRatio||1;cv.width=Math.max(1,Math.floor(box.width*dpr));cv.height=Math.max(1,Math.floor(box.height*dpr));const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,box.width,box.height);if(!r){card.classList.remove('answered');return}card.classList.add('answered');ctx.strokeStyle='#111827';ctx.lineWidth=3.2;ctx.lineCap='round';ctx.lineJoin='round';const sx=box.width/(r.width||1),sy=box.height/(r.height||1),scale=Math.min(sx,sy)*.9,ox=(box.width-(r.width||1)*scale)/2,oy=(box.height-(r.height||1)*scale)/2;for(const stroke of r.strokes||[]){if(stroke.length<2)continue;ctx.beginPath();ctx.moveTo(ox+stroke[0].x*scale,oy+stroke[0].y*scale);for(let k=1;k<stroke.length;k++)ctx.lineTo(ox+stroke[k].x*scale,oy+stroke[k].y*scale);ctx.stroke()}}
function render(s){state=s;document.getElementById('question').textContent=s.question||'等待老師出題…';document.getElementById('round').textContent=`第 ${s.round||1} 題`;for(let i=1;i<=12;i++){document.getElementById('s'+i).textContent=`${s.scores?.[i]||0} 分`;drawResponse(i,s.responses?.[i]||null)}}
socket.on('connect',()=>{document.getElementById('status').classList.add('on');socket.emit('state-request')});socket.on('disconnect',()=>document.getElementById('status').classList.remove('on'));socket.on('game-state',render);socket.on('answer-updated',({player,response})=>{state.responses[player]=response;drawResponse(player,response)});socket.on('score-updated',({player,score})=>{state.scores[player]=score;document.getElementById('s'+player).textContent=`${score} 分`});socket.on('question-changed',render);socket.on('round-changed',render);socket.on('reset-all',render);window.addEventListener('resize',()=>render(state));
</script></body></html>
