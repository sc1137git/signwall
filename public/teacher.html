<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>英文單字競賽｜老師端</title><script src="/signwall/socket.io/socket.io.js"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6fa;color:#172033}button,input{font:inherit}.wrap{max-width:980px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.head h1{font-size:25px;margin:0}.pill{padding:7px 11px;border-radius:999px;background:#fee2e2;color:#991b1b;font-weight:800;font-size:13px}.pill.on{background:#dcfce7;color:#166534}.panel{background:#fff;border:1px solid #dde3ec;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 4px 18px rgba(15,23,42,.05)}.row{display:flex;gap:10px;align-items:center}.q{flex:1;border:2px solid #ccd5e1;border-radius:14px;padding:14px 16px;font-size:21px;font-weight:800;min-width:0}.seconds{width:100px;border:2px solid #ccd5e1;border-radius:14px;padding:12px;font-weight:900;text-align:center}.btn{border:0;border-radius:14px;padding:13px 17px;font-weight:900}.blue{background:#2563eb;color:#fff}.dark{background:#172033;color:white}.gray{background:#e9edf3;color:#273244}.red{background:#dc2626;color:#fff}.small{font-size:13px;color:#6b7280;margin-top:8px}.timerBox{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.timer{font-size:34px;font-weight:950;min-width:90px}.timer.locked{color:#dc2626}.timer.running{color:#2563eb}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.player{background:#fff;border:1px solid #dbe2ec;border-radius:16px;padding:12px}.phead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.num{font-size:23px;font-weight:950}.score{font-size:22px;font-weight:950;color:#ca8a04}.submitted{font-size:12px;font-weight:800;color:#94a3b8}.submitted.yes{color:#15803d}.actions{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px}.scoreBtn{border:0;border-radius:12px;padding:12px 6px;font-size:18px;font-weight:950}.minus{background:#e5e7eb}.plus{background:#dcfce7;color:#166534}.correct{background:#2563eb;color:#fff}.footerActions{display:flex;gap:10px;flex-wrap:wrap}.grow{flex:1}.round{font-weight:900;color:#475569}@media(max-width:760px){.grid{grid-template-columns:repeat(3,1fr)}.row{flex-wrap:wrap}.q{flex-basis:100%}}@media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="wrap"><div class="head"><div><h1>老師控制台</h1><div class="round" id="round">第 1 題</div></div><div class="pill" id="conn">未連線</div></div><div class="panel"><div class="row"><input class="q" id="question" placeholder="輸入公開提示，例如：蘋果；若口頭出題可留白"><button class="btn blue" id="publish">公布題目</button></div><div class="small">公開提示會同步顯示在學生端與投影幕，請不要在這裡輸入正確英文答案。</div></div><div class="panel"><div class="timerBox"><div class="timer" id="timer">待開始</div><input class="seconds" id="seconds" type="number" min="5" max="300" value="30"><span>秒</span><button class="btn blue" id="startTimer">開始／重新計時</button></div><div class="small">倒數歸零後由伺服器鎖定本題，學生不能再修改或送出；老師仍可評分。</div></div><div class="grid" id="grid"></div><div class="panel"><div class="footerActions"><button class="btn dark grow" id="next">下一題（封存本題、保留分數）</button><button class="btn gray" id="clearAnswers">清除本題筆跡</button><button class="btn red" id="reset">整場重置</button></div><div class="small">下一題會清空目前 12 格並保留歷史；整場重置才會清除歷史與全部分數。</div></div></div><script>
const socket=io(location.origin,{path:'/signwall/socket.io',query:{type:'teacher'}});let state={round:1,question:'',scores:{},responses:{},timerEndAt:null,locked:false,timerDuration:30};const grid=document.getElementById('grid');for(let i=1;i<=12;i++){const p=document.createElement('div');p.className='player';p.innerHTML=`<div class="phead"><div><span class="num">${i}</span> 號 <span class="submitted" id="sub${i}">未作答</span></div><div class="score" id="score${i}">0</div></div><div class="actions"><button class="scoreBtn minus" data-p="${i}" data-d="-1">−1</button><button class="scoreBtn correct" data-p="${i}" data-d="1">答對 +1</button><button class="scoreBtn plus" data-p="${i}" data-d="2">+2</button></div>`;grid.appendChild(p)}
function render(s){state=s;document.getElementById('round').textContent=`第 ${s.round||1} 題`;document.getElementById('question').value=s.question||'';if(s.timerDuration)document.getElementById('seconds').value=s.timerDuration;for(let i=1;i<=12;i++){document.getElementById('score'+i).textContent=s.scores?.[i]||0;const el=document.getElementById('sub'+i);const ok=!!s.responses?.[i];el.textContent=ok?'已作答':'未作答';el.classList.toggle('yes',ok)}renderTimer()}
function renderTimer(){const el=document.getElementById('timer');el.classList.remove('locked','running');if(state.locked){el.textContent='時間到';el.classList.add('locked');return}if(state.timerEndAt){const left=Math.max(0,Math.ceil((state.timerEndAt-Date.now())/1000));el.textContent=left+' 秒';el.classList.add('running');return}el.textContent='待開始'}setInterval(renderTimer,200);
socket.on('connect',()=>{document.getElementById('conn').textContent='已連線';document.getElementById('conn').classList.add('on');socket.emit('state-request')});socket.on('disconnect',()=>{document.getElementById('conn').textContent='未連線';document.getElementById('conn').classList.remove('on')});socket.on('game-state',render);socket.on('answer-updated',({player,response})=>{state.responses[player]=response;render(state)});socket.on('score-updated',({player,score})=>{state.scores[player]=score;render(state)});socket.on('question-changed',render);socket.on('round-changed',render);socket.on('timer-started',render);socket.on('timer-ended',render);socket.on('reset-all',render);
document.getElementById('publish').onclick=()=>socket.emit('teacher-set-question',{question:document.getElementById('question').value.trim()});document.getElementById('question').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('publish').click()});document.getElementById('startTimer').onclick=()=>{const seconds=Math.max(5,Math.min(300,Number(document.getElementById('seconds').value)||30));document.getElementById('seconds').value=seconds;socket.emit('teacher-start-timer',{seconds})};grid.addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(!b)return;socket.emit('teacher-score',{player:Number(b.dataset.p),delta:Number(b.dataset.d)})});document.getElementById('next').onclick=()=>socket.emit('teacher-next-round');document.getElementById('clearAnswers').onclick=()=>socket.emit('teacher-clear-answers');document.getElementById('reset').onclick=()=>{if(confirm('確定要清除全部筆跡紀錄與所有分數嗎？'))socket.emit('teacher-reset-all')};
</script></body></html>
