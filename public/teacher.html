<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>英文單字競賽｜老師端</title><script src="/signwall/socket.io/socket.io.js"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6fa;color:#172033}button,input{font:inherit}.wrap{max-width:1050px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.head h1{font-size:25px;margin:0}.pill{padding:7px 11px;border-radius:999px;background:#fee2e2;color:#991b1b;font-weight:800;font-size:13px}.pill.on{background:#dcfce7;color:#166534}.panel{background:#fff;border:1px solid #dde3ec;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 4px 18px rgba(15,23,42,.05)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.q{flex:1;min-width:280px;border:2px solid #ccd5e1;border-radius:14px;padding:14px 16px;font-size:21px;font-weight:800}.seconds{width:82px;border:2px solid #ccd5e1;border-radius:12px;padding:10px;font-weight:900;text-align:center}.btn{border:0;border-radius:14px;padding:13px 17px;font-weight:900;cursor:pointer}.btn:disabled{opacity:.4;cursor:not-allowed}.blue{background:#2563eb;color:#fff}.green{background:#15803d;color:#fff}.dark{background:#172033;color:#fff}.gray{background:#e9edf3;color:#273244}.red{background:#dc2626;color:#fff}.small{font-size:13px;color:#6b7280;margin-top:8px}.timing{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:12px}.setting{display:flex;align-items:center;gap:7px;font-weight:800}.timer{font-size:30px;font-weight:950;margin-left:auto}.timer.preview{color:#7c3aed}.timer.running{color:#2563eb}.timer.ended{color:#dc2626}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.player{background:#fff;border:2px solid #dbe2ec;border-radius:16px;padding:12px;transition:.15s}.player.answered{border-color:#93c5fd}.player.awarded{border-color:#22c55e;background:#f0fdf4}.phead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.num{font-size:23px;font-weight:950}.score{font-size:22px;font-weight:950;color:#ca8a04}.submitted{font-size:12px;font-weight:800;color:#94a3b8}.submitted.yes{color:#15803d}.awardBtn{width:100%;border:0;border-radius:12px;padding:12px 8px;font-size:17px;font-weight:950;background:#2563eb;color:#fff}.awardBtn.done{background:#16a34a}.undo{width:100%;border:0;background:transparent;color:#b91c1c;font-weight:800;padding:7px 0 0}.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.sectionHead h2{margin:0;font-size:18px}.footerActions,.historyControls{display:flex;gap:10px;flex-wrap:wrap}.grow{flex:1}.round{font-weight:900;color:#475569}.viewStatus{font-weight:900;color:#7c3aed}.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);padding:10px 16px;border-radius:999px;background:#172033;color:#fff;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:99}.toast.show{opacity:1}@media(max-width:760px){.grid{grid-template-columns:repeat(3,1fr)}.timer{margin-left:0}}@media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr)}.q{min-width:100%}}
</style></head><body><div class="wrap"><div class="head"><div><h1>老師控制台</h1><div class="round" id="round">第 1 題</div></div><div class="pill" id="conn">未連線</div></div>
<div class="panel"><div class="row"><input class="q" id="question" placeholder="輸入本題提示，例如：蘋果"><button class="btn blue" id="publish">公布題目</button></div><div class="timing"><div class="setting">看題 <input class="seconds" id="previewSeconds" type="number" min="0" max="30" value="3"> 秒</div><div class="setting">作答 <input class="seconds" id="answerSeconds" type="number" min="5" max="300" value="30"> 秒</div><button class="btn gray" id="restartAnswer">重開作答計時</button><div class="timer" id="timer">等待出題</div></div><div class="small">按「公布題目」後，學生先滿版看題；看題時間結束才解鎖畫布並開始計算作答時間。按 Enter 不會自動開始。</div></div>
<div class="panel"><div class="sectionHead"><h2>本題評分</h2><button class="btn green" id="allCorrect">全部已作答 +1</button></div><div class="grid" id="grid"></div><div class="small">每位學生本題只會記一次給分；已給分會變綠並顯示 ✓。按錯可撤銷後重給。</div></div>
<div class="panel"><div class="sectionHead"><h2>投影回看</h2><div class="viewStatus" id="viewStatus">投影：目前題</div></div><div class="historyControls"><button class="btn gray" id="prevView">← 上一題</button><button class="btn blue" id="liveView">回到目前題</button><button class="btn gray" id="nextView">下一題 →</button></div><div class="small">只會切換投影幕看到的題目；學生 iPad 仍維持目前題，不受影響。</div></div>
<div class="panel"><div class="footerActions"><button class="btn dark grow" id="next">下一題（封存本題、保留分數）</button><button class="btn red" id="reset">整場重置</button></div></div></div><div class="toast" id="toast"></div><script>
const socket=io(location.origin,{path:'/signwall/socket.io',query:{type:'teacher'}});
let state={round:1,question:'',scores:{},responses:{},roundAwards:{},historyRounds:[],displayViewRound:1,previewDuration:3,previewEndAt:null,timerDuration:30,timerEndAt:null,phase:'waiting',locked:true};
const grid=document.getElementById('grid');
for(let i=1;i<=12;i++){const p=document.createElement('div');p.className='player';p.id='p'+i;p.innerHTML=`<div class="phead"><div><span class="num">${i}</span> 號 <span class="submitted" id="sub${i}">未作答</span></div><div class="score" id="score${i}">0 分</div></div><button class="awardBtn" id="award${i}" data-p="${i}">答對 +1</button><button class="undo" id="undo${i}" data-undo="${i}" style="display:none">撤銷本題給分</button>`;grid.appendChild(p)}
function toast(t,bg='#172033'){const e=document.getElementById('toast');e.textContent=t;e.style.background=bg;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1800)}
function render(s){state={...state,...s};document.getElementById('round').textContent=`第 ${state.round||1} 題`;document.getElementById('question').value=state.question||'';document.getElementById('previewSeconds').value=state.previewDuration??3;document.getElementById('answerSeconds').value=state.timerDuration??30;for(let i=1;i<=12;i++){const submitted=!!state.responses?.[i],awarded=Object.prototype.hasOwnProperty.call(state.roundAwards||{},i),delta=state.roundAwards?.[i];const card=document.getElementById('p'+i),sub=document.getElementById('sub'+i),btn=document.getElementById('award'+i),undo=document.getElementById('undo'+i);card.classList.toggle('answered',submitted);card.classList.toggle('awarded',awarded);sub.textContent=submitted?'已作答':'未作答';sub.classList.toggle('yes',submitted);document.getElementById('score'+i).textContent=`${state.scores?.[i]||0} 分`;btn.disabled=!submitted||awarded;btn.classList.toggle('done',awarded);btn.textContent=awarded?`已給 ${delta>=0?'+':''}${delta} ✓`:'答對 +1';undo.style.display=awarded?'block':'none'}renderTimer();renderHistory()}
function renderTimer(){const e=document.getElementById('timer');e.className='timer';if(state.phase==='preview'){const left=Math.max(0,Math.ceil(((state.previewEndAt||Date.now())-Date.now())/1000));e.textContent=`看題 ${left} 秒`;e.classList.add('preview')}else if(state.phase==='running'){const left=Math.max(0,Math.ceil(((state.timerEndAt||Date.now())-Date.now())/1000));e.textContent=`作答 ${left} 秒`;e.classList.add('running')}else if(state.phase==='ended'){e.textContent='時間到';e.classList.add('ended')}else e.textContent='等待出題'}
function allViewRounds(){return [...(state.historyRounds||[]),state.round].filter((v,i,a)=>a.indexOf(v)===i).sort((a,b)=>a-b)}
function renderHistory(){const rounds=allViewRounds(),v=state.displayViewRound||state.round;document.getElementById('viewStatus').textContent=v===state.round?`投影：第 ${state.round} 題（目前）`:`投影：第 ${v} 題（回看）`;const idx=rounds.indexOf(v);document.getElementById('prevView').disabled=idx<=0;document.getElementById('nextView').disabled=idx<0||idx>=rounds.length-1;document.getElementById('liveView').disabled=v===state.round}
setInterval(()=>{renderTimer()},200);
socket.on('connect',()=>{document.getElementById('conn').textContent='已連線';document.getElementById('conn').classList.add('on');socket.emit('state-request')});socket.on('disconnect',()=>{document.getElementById('conn').textContent='未連線';document.getElementById('conn').classList.remove('on')});socket.on('game-state',render);socket.on('preview-started',render);socket.on('answer-started',render);socket.on('timer-ended',render);socket.on('round-changed',render);socket.on('reset-all',render);socket.on('display-view-changed',render);socket.on('answer-updated',({player,response})=>{state.responses[player]=response;render(state)});socket.on('score-updated',({player,score,awardDelta})=>{state.scores[player]=score;if(awardDelta!==undefined&&awardDelta!==null)state.roundAwards[player]=awardDelta;render(state)});socket.on('award-cleared',({player,score})=>{state.scores[player]=score;delete state.roundAwards[player];render(state)});socket.on('score-result',r=>{if(!r.ok&&r.reason==='already_scored')toast(`${r.player} 號本題已給過分`,'#b45309');if(!r.ok&&r.reason==='not_submitted')toast(`${r.player} 號尚未作答`,'#b45309')});socket.on('bulk-score-result',r=>toast(r.count?`已替 ${r.count} 位尚未給分的作答者 +1`:'本題已沒有需要補給分的人','#15803d'));
document.getElementById('publish').onclick=()=>{const previewSeconds=Math.max(0,Math.min(30,Number(document.getElementById('previewSeconds').value)||0));const answerSeconds=Math.max(5,Math.min(300,Number(document.getElementById('answerSeconds').value)||30));socket.emit('teacher-set-question',{question:document.getElementById('question').value.trim(),previewSeconds,answerSeconds})};document.getElementById('restartAnswer').onclick=()=>{const seconds=Math.max(5,Math.min(300,Number(document.getElementById('answerSeconds').value)||30));socket.emit('teacher-start-timer',{seconds})};grid.addEventListener('click',e=>{const score=e.target.closest('[data-p]');if(score)socket.emit('teacher-score',{player:Number(score.dataset.p),delta:1});const undo=e.target.closest('[data-undo]');if(undo)socket.emit('teacher-clear-award',{player:Number(undo.dataset.undo)})});document.getElementById('allCorrect').onclick=()=>socket.emit('teacher-score-all-submitted');document.getElementById('next').onclick=()=>socket.emit('teacher-next-round');document.getElementById('reset').onclick=()=>{if(confirm('確定要清除全部題目、筆跡歷史與所有分數嗎？'))socket.emit('teacher-reset-all')};document.getElementById('liveView').onclick=()=>socket.emit('teacher-view-round',{round:state.round});document.getElementById('prevView').onclick=()=>{const rs=allViewRounds(),i=rs.indexOf(state.displayViewRound||state.round);if(i>0)socket.emit('teacher-view-round',{round:rs[i-1]})};document.getElementById('nextView').onclick=()=>{const rs=allViewRounds(),i=rs.indexOf(state.displayViewRound||state.round);if(i>=0&&i<rs.length-1)socket.emit('teacher-view-round',{round:rs[i+1]})};
</script></body></html>
