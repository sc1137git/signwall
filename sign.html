<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>互動簽名牆｜簽名</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif;background:#f4f6f8;touch-action:none}body{display:flex;flex-direction:column}.head{text-align:center;background:#fff;padding:12px;border-bottom:1px solid #e5e7eb}.head b{font-size:20px}.head div{font-size:13px;color:#6b7280;margin-top:3px}.wrap{flex:1;min-height:0;padding:10px}.paper{height:100%;background:#fff;border-radius:18px;box-shadow:0 4px 18px #00000012;display:flex;align-items:center;justify-content:center;overflow:hidden}canvas{display:block;touch-action:none}.bar{display:flex;gap:12px;justify-content:center;padding:14px;background:#fff;border-top:1px solid #e5e7eb}button{border:0;border-radius:12px;padding:13px 34px;font-size:17px;font-weight:700}#clear{background:#e5e7eb;color:#374151}#send{background:#2563eb;color:#fff}button:disabled{opacity:.4}.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);padding:8px 18px;border-radius:999px;color:#fff;background:#111827;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}
</style>
</head>
<body>
<div class="head"><b>✍️ 互動簽名牆</b><div>請在白色區域簽名，完成後按「送出」</div></div>
<div class="wrap"><div class="paper"><canvas id="pad"></canvas></div></div>
<div class="bar"><button id="clear">清除</button><button id="send" disabled>送出 ✓</button></div>
<div id="toast" class="toast"></div>
<script>
const W=800,H=400,pad=document.querySelector('#pad'),ctx=pad.getContext('2d');
const clearBtn=document.querySelector('#clear'),sendBtn=document.querySelector('#send'),toast=document.querySelector('#toast');
let strokes=[],current=[],drawing=false,connected=false;
const queue=[];
const socket=io({query:{type:'sign'}});
socket.on('connect',()=>{connected=true;notice('已連線','#15803d');while(queue.length)socket.emit('new-signature',queue.shift())});
socket.on('disconnect',()=>{connected=false;notice('連線中斷，簽名會暫存','#b45309')});
socket.on('connect_error',()=>{connected=false});
function notice(text,bg){toast.textContent=text;toast.style.background=bg||'#111827';toast.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>toast.classList.remove('show'),1800)}
function resize(){const box=document.querySelector('.paper').getBoundingClientRect(),scale=Math.min((box.width-20)/W,(box.height-20)/H,1),dpr=devicePixelRatio||1;pad.width=W*dpr;pad.height=H*dpr;pad.style.width=Math.floor(W*scale)+'px';pad.style.height=Math.floor(H*scale)+'px';ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111827';redraw()}
function point(e){const r=pad.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function draw(s){if(s.length<2)return;ctx.beginPath();ctx.moveTo(s[0].x,s[0].y);for(let i=1;i<s.length;i++)ctx.lineTo(s[i].x,s[i].y);ctx.stroke()}
function redraw(){ctx.clearRect(0,0,W,H);strokes.forEach(draw);draw(current)}
function down(e){e.preventDefault();drawing=true;current=[point(e)];sendBtn.disabled=false;try{pad.setPointerCapture(e.pointerId)}catch{}}
function move(e){if(!drawing)return;e.preventDefault();const p=point(e);current.push(p);if(current.length===2){ctx.beginPath();ctx.moveTo(current[0].x,current[0].y)}ctx.lineTo(p.x,p.y);ctx.stroke()}
function up(e){if(!drawing)return;e.preventDefault();drawing=false;if(current.length)strokes.push(current);current=[]}
pad.addEventListener('pointerdown',down);pad.addEventListener('pointermove',move);pad.addEventListener('pointerup',up);pad.addEventListener('pointercancel',up);
clearBtn.onclick=()=>{strokes=[];current=[];ctx.clearRect(0,0,W,H);sendBtn.disabled=true};
sendBtn.onclick=()=>{if(!strokes.length)return;const data={id:crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2),strokes:strokes.map(s=>s.map(p=>({x:+p.x.toFixed(1),y:+p.y.toFixed(1)}))),timestamp:Date.now()};connected?socket.emit('new-signature',data):queue.push(data);notice(connected?'簽名已送出 ✓':'離線暫存，恢復連線後送出',connected?'#15803d':'#b45309');strokes=[];current=[];ctx.clearRect(0,0,W,H);sendBtn.disabled=true};
addEventListener('resize',resize);resize();
</script>
</body>
</html>
