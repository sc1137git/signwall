name: english-competition

services:
  english-competition:
    build: .
    container_name: english-competition
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - TEACHER_PASSWORD=${TEACHER_PASSWORD:-1234}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
    volumes:
      - ./data:/app/data
