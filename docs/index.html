<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SignWall Demo</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif;background:#0b1220;color:#fff}.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #ffffff16;background:#0f172acc}.top b{font-size:20px}.tag{font-size:12px;color:#cbd5e1;background:#ffffff10;padding:6px 10px;border-radius:999px}.layout{height:calc(100vh - 58px);display:grid;grid-template-columns:42% 58%}.sign{background:#f4f6f8;color:#111827;padding:18px;display:flex;flex-direction:column;gap:12px}.sign h2{margin:0;font-size:20px}.sign p{margin:0;color:#6b7280;font-size:13px}.paper{flex:1;min-height:240px;background:#fff;border-radius:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 20px #00000012;overflow:hidden}.paper canvas{touch-action:none;max-width:100%;max-height:100%}.buttons{display:flex;gap:10px;justify-content:center}.buttons button{border:0;border-radius:12px;padding:12px 26px;font-weight:700;font-size:16px}.clear{background:#e5e7eb}.send{background:#2563eb;color:#fff}.send:disabled{opacity:.4}.wall{position:relative;overflow:hidden;background:radial-gradient(circle at 50% 45%,#1e293b,#0f172a 58%,#070b13)}#wall{width:100%;height:100%;display:block}.hint{position:absolute;left:18px;top:16px;padding:7px 11px;border-radius:999px;background:#0006;color:#e2e8f0;font-size:12px}.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:#64748b;font-size:15px}.empty.hide{display:none}@media(max-width:800px){.layout{height:auto;grid-template-columns:1fr}.sign{height:52vh}.wall{height:48vh}.top .tag{display:none}}
</style>
</head>
<body>
<div class="top"><b>✍️ SignWall 互動簽名牆</b><span class="tag">GitHub Pages · 單機互動 Demo</span></div>
<div class="layout">
<section class="sign"><h2>1. 在這裡簽名</h2><p>這個 Demo 不連伺服器；按送出後會直接模擬飛到右側顯示牆。</p><div class="paper"><canvas id="pad"></canvas></div><div class="buttons"><button id="clear" class="clear">清除</button><button id="send" class="send" disabled>送到牆上 ✓</button></div></section>
<section class="wall"><canvas id="wall"></canvas><div class="hint">2. 顯示牆 Demo</div><div id="empty" class="empty">送出第一個簽名看看</div></section>
</div>
<script>
const PW=800,PH=400,pad=document.querySelector('#pad'),pc=pad.getContext('2d'),wall=document.querySelector('#wall'),wc=wall.getContext('2d'),send=document.querySelector('#send'),empty=document.querySelector('#empty');let strokes=[],current=[],drawing=false,items=[];
function resizePad(){const r=document.querySelector('.paper').getBoundingClientRect(),s=Math.min((r.width-20)/PW,(r.height-20)/PH,1),d=devicePixelRatio||1;pad.width=PW*d;pad.height=PH*d;pad.style.width=PW*s+'px';pad.style.height=PH*s+'px';pc.setTransform(d,0,0,d,0,0);pc.lineWidth=3;pc.lineCap='round';pc.lineJoin='round';pc.strokeStyle='#111827';redrawPad()}
function resizeWall(){const r=wall.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);wall.width=r.width*d;wall.height=r.height*d;wc.setTransform(d,0,0,d,0,0)}function pos(e){const r=pad.getBoundingClientRect();return{x:(e.clientX-r.left)*PW/r.width,y:(e.clientY-r.top)*PH/r.height}}function stroke(c,s){if(s.length<2)return;c.beginPath();c.moveTo(s[0].x,s[0].y);for(let i=1;i<s.length;i++)c.lineTo(s[i].x,s[i].y);c.stroke()}function redrawPad(){pc.clearRect(0,0,PW,PH);strokes.forEach(s=>stroke(pc,s));stroke(pc,current)}
pad.onpointerdown=e=>{e.preventDefault();drawing=true;current=[pos(e)];send.disabled=false;try{pad.setPointerCapture(e.pointerId)}catch{}};pad.onpointermove=e=>{if(!drawing)return;e.preventDefault();const p=pos(e);current.push(p);if(current.length===2){pc.beginPath();pc.moveTo(current[0].x,current[0].y)}pc.lineTo(p.x,p.y);pc.stroke()};pad.onpointerup=pad.onpointercancel=e=>{if(!drawing)return;drawing=false;if(current.length)strokes.push(current);current=[]};document.querySelector('#clear').onclick=()=>{strokes=[];current=[];pc.clearRect(0,0,PW,PH);send.disabled=true};
function bounds(ss){let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;for(const s of ss)for(const p of s){a=Math.min(a,p.x);b=Math.min(b,p.y);c=Math.max(c,p.x);d=Math.max(d,p.y)}return{minX:a,minY:b,w:Math.max(1,c-a),h:Math.max(1,d-b)}}
send.onclick=()=>{if(!strokes.length)return;const ss=strokes.map(s=>s.map(p=>({...p}))),b=bounds(ss),r=wall.getBoundingClientRect(),tx=90+Math.random()*Math.max(1,r.width-180),ty=90+Math.random()*Math.max(1,r.height-180),edge=Math.floor(Math.random()*4);let x=tx,y=ty;if(edge===0)y=-120;if(edge===1)x=r.width+120;if(edge===2)y=r.height+120;if(edge===3)x=-120;items.push({ss,b,x,y,tx,ty,born:performance.now(),scale:Math.min(1.1,Math.max(.35,220/Math.max(b.w,b.h))),color:['#fff','#93c5fd','#a7f3d0','#fde68a','#f9a8d4','#c4b5fd'][Math.floor(Math.random()*6)],px:Math.random()*6.28,py:Math.random()*6.28});empty.classList.add('hide');strokes=[];current=[];pc.clearRect(0,0,PW,PH);send.disabled=true};
function frame(t){const r=wall.getBoundingClientRect();wc.clearRect(0,0,r.width,r.height);for(const it of items){const age=t-it.born,p=Math.min(age/900,1),q=1-Math.pow(1-p,3),fx=it.x+(it.tx-it.x)*q,fy=it.y+(it.ty-it.y)*q,x=p<1?fx:it.tx+Math.sin(t/1000*.35+it.px)*6,y=p<1?fy:it.ty+Math.sin(t/1000*.31+it.py)*5;wc.save();wc.translate(x,y);wc.scale(it.scale,it.scale);wc.translate(-it.b.w/2,-it.b.h/2);wc.strokeStyle=it.color;wc.globalAlpha=q;wc.lineWidth=4/it.scale;wc.lineCap='round';wc.lineJoin='round';for(const s of it.ss){const shifted=s.map(v=>({x:v.x-it.b.minX,y:v.y-it.b.minY}));stroke(wc,shifted)}wc.restore()}requestAnimationFrame(frame)}requestAnimationFrame(frame);addEventListener('resize',()=>{resizePad();resizeWall()});resizePad();resizeWall();
</script>
</body>
</html>
